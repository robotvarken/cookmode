<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Cook Mode</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 32px;
      margin: 0 0 35px;
    }

    /* Toggle */

    .toggle {
      position: relative;
      display: inline-block;
      width: 100px;
      height: 56px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #444444;
      border-radius: 56px;
      cursor: pointer;
      transition: 0.25s;
    }

    .slider::before {
      content: "";
      position: absolute;
      width: 44px;
      height: 44px;
      left: 6px;
      top: 6px;
      background: white;
      border-radius: 50%;
      transition: 0.25s;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
    }

    input:checked + .slider {
      background: #39d98a;
    }

    input:checked + .slider::before {
      transform: translateX(44px);
    }

    .status {
      margin-top: 25px;
      font-size: 20px;
      font-weight: 600;
    }

    .hint {
      margin-top: 10px;
      color: #777777;
      font-size: 14px;
    }

    /* User Agent */

    .user-agent {
      margin-top: 45px;
      padding-top: 20px;
      border-top: 1px solid #2d2d2d;
      text-align: left;
    }

    .user-agent-title {
      color: #888888;
      font-size: 13px;
      margin-bottom: 10px;
    }

    .user-agent-value {
      color: #aaaaaa;
      font-size: 11px;
      line-height: 1.5;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <main class="container">

    <h1>Keep Active</h1>

    <label class="toggle">
      <input type="checkbox" id="cookToggle">
      <span class="slider"></span>
    </label>

    <div class="status" id="status">OFF</div>

    <div class="hint" id="hint">
      Keep your screen awake while cooking
    </div>

    <div class="user-agent">
      <div class="user-agent-title">User Agent</div>
      <div class="user-agent-value" id="userAgent"></div>
    </div>

  </main>

  <script>
    const toggle = document.getElementById("cookToggle");
    const status = document.getElementById("status");
    const hint = document.getElementById("hint");

    let wakeLock = null;

    async function enableCookMode() {
      if (!("wakeLock" in navigator)) {
        status.textContent = "Not supported";
        hint.textContent =
          "Your browser doesn't support screen wake lock.";
        toggle.checked = false;
        return;
      }

      try {
        wakeLock = await navigator.wakeLock.request("screen");

        status.textContent = "ON";
        hint.textContent = "Your screen will stay awake";

        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });

      } catch (error) {
        console.error(error);

        status.textContent = "Couldn't activate";
        hint.textContent = "Please try again.";
        toggle.checked = false;
      }
    }

    async function disableCookMode() {
      if (wakeLock) {
        await wakeLock.release();
        wakeLock = null;
      }

      status.textContent = "OFF";
      hint.textContent =
        "Keep your screen awake while cooking";
    }

    toggle.addEventListener("change", async () => {
      if (toggle.checked) {
        await enableCookMode();
      } else {
        await disableCookMode();
      }
    });

    document.addEventListener("visibilitychange", async () => {
      if (
        document.visibilityState === "visible" &&
        toggle.checked
      ) {
        await enableCookMode();
      }
    });

    // Display the browser's exact User Agent
    document.getElementById("userAgent").textContent =
      navigator.userAgent;
  </script>

</body>
</html>
